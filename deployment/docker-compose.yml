version: '3.8'

services:
  crosscontext-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: crosscontext-agentcore
    environment:
      - ENV=local
      - SQLITE_DB_PATH=/app/data/crosscontext_graph.db
      - AWS_REGION=us-east-1
    volumes:
      - ../data:/app/data
      - ../testbed:/app/testbed
    ports:
      - "8080:8080"
    restart: unless-stopped

  crosscontext-ui:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: crosscontext-dashboard
    command: ["python", "-m", "ui.api_server"]
    environment:
      - ENV=local
      - SQLITE_DB_PATH=/app/data/crosscontext_graph.db
      - PORT=8000
    volumes:
      - ../data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - crosscontext-agent
